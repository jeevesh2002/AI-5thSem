name: CodeGuard security checks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Optional comparison commit or ref; defaults to the previous commit
        required: false
        type: string

permissions:
  contents: read

jobs:
  local-security-checks:
    name: Local security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
      DO_NOT_TRACK: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out the change and comparison history
        # Native checkout avoids auth cleanup traversing incomplete legacy gitlinks.
        shell: bash
        env:
          CODEGUARD_GITHUB_TOKEN: ${{ github.token }}
          CODEGUARD_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$CODEGUARD_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid checkout commit" >&2; exit 2; }
          # Credentials exist only in this step's environment, never in Git config.
          # Gitlinks are checked out as entries; submodules are never initialized.
          unset GIT_TRACE GIT_TRACE_PACKET GIT_TRACE_CURL GIT_CURL_VERBOSE
          export GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_COUNT=3
          export GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CODEGUARD_GITHUB_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_KEY_1=credential.helper
          export GIT_CONFIG_VALUE_1=''
          export GIT_CONFIG_KEY_2=submodule.recurse
          export GIT_CONFIG_VALUE_2=false
          cleanup_auth() {
            unset CODEGUARD_GITHUB_TOKEN GIT_CONFIG_COUNT
            unset GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GIT_CONFIG_KEY_1 GIT_CONFIG_VALUE_1
            unset GIT_CONFIG_KEY_2 GIT_CONFIG_VALUE_2
          }
          trap cleanup_auth EXIT
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --no-recurse-submodules origin \
            '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          # Fork PR heads and older event SHAs may not be in the advertised branch refs.
          if ! git cat-file -e "${CODEGUARD_HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --no-recurse-submodules origin "$CODEGUARD_HEAD_SHA"
          fi
          cleanup_auth
          git -c submodule.recurse=false checkout --detach "$CODEGUARD_HEAD_SHA"
          [[ "$(git rev-parse HEAD)" == "$CODEGUARD_HEAD_SHA" ]]

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned local scanners
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'semgrep==1.176.1'
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/codeguard-gitleaks.tar.gz" \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/codeguard-gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/codeguard-bin"
          tar -xzf "$RUNNER_TEMP/codeguard-gitleaks.tar.gz" -C "$RUNNER_TEMP/codeguard-bin" gitleaks
          echo "$RUNNER_TEMP/codeguard-bin" >> "$GITHUB_PATH"

      - name: Check changes with local rules and redacted secret detection
        env:
          CODEGUARD_BASE_REF: ${{ inputs.base_ref }}
        run: python .github/codeguard/ci-scan.py
